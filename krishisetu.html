<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KrishiSetu — कृषि सेतु</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F3;
    --surface:#FFFFFF;
    --ink:#16211D;
    --ink-soft:#5E6B62;
    --primary:#0E4749;
    --primary-2:#12615F;
    --accent:#E2932B;
    --clay:#C0512B;
    --moss:#3F7D4E;
    --line:#DCE3DC;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Manrope','Noto Sans','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Tamil',
      'Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Gujarati',
      'Noto Sans Gurmukhi','Noto Sans Oriya','Noto Nastaliq Urdu',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{ font-family:'Instrument Serif','Manrope',serif; font-style:italic; }
  h1,h2{ margin:0; }
  .wrap{ max-width:1000px; margin:0 auto; padding:0 20px 60px; }

  /* ---------- Landing / language page ---------- */
  .landing{
    min-height:100vh; position:relative; overflow:hidden;
    background:
      radial-gradient(600px 400px at 12% -10%, rgba(226,147,43,0.22), transparent 60%),
      radial-gradient(700px 500px at 110% 10%, rgba(18,97,95,0.30), transparent 55%),
      radial-gradient(500px 400px at 50% 120%, rgba(63,125,78,0.18), transparent 60%),
      var(--primary);
    color:#F4F6F3;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 20px;
  }
  .landing .brandrow{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .bridge-mark{ width:38px; height:38px; flex:none; }
  .landing h1{ font-family:'Instrument Serif',serif; font-style:italic; font-size:44px; font-weight:400; letter-spacing:0.2px; }
  .landing .devname{ font-size:19px; opacity:0.85; margin-top:-4px; }
  .landing .lead{ max-width:560px; text-align:center; font-size:15.5px; opacity:0.88; margin:18px 0 34px; line-height:1.6; }
  .lang-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px; width:100%; max-width:820px;
  }
  .lang-chip{
    background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.18);
    border-radius:12px; padding:14px 10px; text-align:center; cursor:pointer;
    transition:background .15s, border-color .15s, transform .1s;
    color:#F4F6F3;
  }
  .lang-chip:hover{ background:rgba(255,255,255,0.14); transform:translateY(-1px); }
  .lang-chip.selected{ background:var(--accent); border-color:var(--accent); color:#241704; }
  .lang-chip .native{ font-size:17px; font-weight:600; display:block; }
  .lang-chip .eng{ font-size:10.5px; opacity:0.7; display:block; margin-top:3px; letter-spacing:0.2px; }
  .lang-chip.selected .eng{ opacity:0.75; }
  .lang-chip.partial .native::after{ content:"·"; opacity:0.5; margin-left:3px; }

  .landing .continue-row{ margin-top:30px; text-align:center; }
  .btn-continue{
    font-family:'Manrope',sans-serif; font-weight:700; font-size:15px;
    background:var(--accent); color:#241704; border:none; border-radius:999px;
    padding:13px 34px; cursor:pointer;
  }
  .btn-continue:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-continue:hover:not(:disabled){ opacity:0.92; }
  .partial-note{ font-size:11.5px; opacity:0.65; margin-top:10px; max-width:420px; text-align:center; }

  /* ---------- App shell ---------- */
  header.top{
    background:linear-gradient(120deg, var(--primary), var(--primary-2));
    color:#F4F6F3; border-bottom:3px solid var(--accent);
  }
  .top-inner{ max-width:1000px; margin:0 auto; padding:20px 20px 0; display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand h1{ font-family:'Instrument Serif',serif; font-style:italic; font-size:25px; font-weight:400; }
  .brand .bridge-mark{ width:26px; height:26px; }
  .tagline{ font-size:12.5px; opacity:0.82; margin:2px 0 0; }
  .langswitch{
    font-size:12.5px; color:#F4F6F3; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.3);
    border-radius:999px; padding:6px 13px; cursor:pointer; font-weight:600;
  }
  .langswitch:hover{ background:rgba(255,255,255,0.22); }
  nav.tabs{ display:flex; gap:4px; margin-top:18px; overflow-x:auto; }
  nav.tabs button{
    font-family:inherit; background:none; border:none; border-bottom:3px solid transparent;
    padding:12px 16px 12px 2px; margin-right:14px; font-size:14px; font-weight:600;
    color:rgba(244,246,243,0.65); cursor:pointer; white-space:nowrap;
  }
  nav.tabs button.active{ color:#fff; border-bottom-color:var(--accent); }
  nav.tabs button:hover{ color:#fff; }

  section.panel{ padding-top:26px; }
  .grid2{ display:grid; grid-template-columns:1.1fr 0.9fr; gap:20px; }
  @media (max-width:760px){ .grid2{ grid-template-columns:1fr; } }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:0 1px 2px rgba(20,40,30,0.04); }
  .card + .card{ margin-top:18px; }
  .card h2{ font-size:18px; font-weight:700; margin:0 0 4px; }
  .card .hint{ font-size:13px; color:var(--ink-soft); margin:0 0 16px; }

  label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin:14px 0 5px; text-transform:uppercase; letter-spacing:0.3px; }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=tel], input[type=number], select{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff;
    font-family:inherit; font-size:14.5px; color:var(--ink);
  }
  input:focus, select:focus, button:focus-visible{ outline:2px solid var(--primary-2); outline-offset:1px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .btn{
    font-family:inherit; font-weight:700; font-size:14px; border-radius:10px;
    border:none; background:var(--primary); color:#fff; padding:12px 20px; cursor:pointer; margin-top:18px;
  }
  .btn:hover{ opacity:0.9; }
  .btn.small{ padding:8px 13px; font-size:12.5px; margin-top:0; border-radius:8px; }
  .btn.gold{ background:var(--accent); color:#241704; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .msg{ font-size:13.5px; padding:10px 13px; margin-top:14px; border-radius:10px; }
  .msg.ok{ background:#E7F2EA; color:#1E3B29; }
  .msg.err{ background:#FBEAE3; color:#6B2A15; }

  .token-confirm{ margin-top:18px; border-radius:14px; padding:20px; text-align:center; background:linear-gradient(135deg, #0E4749, #12615F); color:#F4F6F3; }
  .token-confirm .num{ font-family:'Instrument Serif',serif; font-style:italic; font-size:52px; font-weight:400; line-height:1; color:var(--accent); }
  .token-confirm .label{ font-size:11px; letter-spacing:1.5px; opacity:0.75; }
  .token-confirm .detail{ font-size:13.5px; margin-top:8px; opacity:0.92; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:11px; color:var(--ink-soft); font-weight:700; padding:8px 8px; border-bottom:1.5px solid var(--ink); text-transform:uppercase; letter-spacing:0.3px; }
  td{ padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }

  .pill{ display:inline-block; padding:4px 11px; font-size:11px; font-weight:700; border-radius:999px; }
  .pill.booked{ color:var(--ink-soft); background:#EBEEEA; }
  .pill.progress{ color:#fff; background:var(--clay); }
  .pill.procured{ color:#241704; background:var(--accent); }
  .pill.paid{ color:#fff; background:var(--moss); }

  .board{ background:linear-gradient(135deg, var(--primary), var(--primary-2)); color:#F4F6F3; padding:36px 22px; text-align:center; border-radius:var(--radius); }
  .board .label{ font-size:12px; letter-spacing:2px; opacity:0.75; }
  .board .num{ font-family:'Instrument Serif',serif; font-style:italic; font-size:92px; font-weight:400; line-height:1; margin:4px 0; color:var(--accent); }
  .board .sub{ font-size:13px; opacity:0.85; }

  .statline{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .statline:last-child{ border-bottom:none; }
  .statline b{ font-weight:800; }

  .notif{ border-bottom:1px solid var(--line); padding:11px 0; font-size:13.5px; }
  .notif:last-child{ border-bottom:none; }
  .notif .t{ font-size:11px; color:var(--ink-soft); margin-bottom:2px; }

  .queue-select{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px; }
  .queue-select > div{ flex:1; min-width:170px; }

  .pin-gate{ max-width:320px; margin:60px auto; text-align:center; }
  .pin-gate .card{ text-align:left; }

  .actioncell{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .actioncell input{ width:82px; padding:7px 8px; font-size:13px; border-radius:8px; }

  /* ---------- Login / Register (OTP) ---------- */
  .auth-tabs{ display:flex; gap:0; margin:-22px -22px 18px; border-bottom:1.5px solid var(--line); }
  .auth-tab-btn{
    flex:1; font-family:inherit; font-weight:700; font-size:13.5px; text-align:center;
    background:none; border:none; padding:14px 10px; cursor:pointer; color:var(--ink-soft);
    border-bottom:3px solid transparent; margin-bottom:-1.5px;
  }
  .auth-tab-btn.active{ color:var(--primary); border-bottom-color:var(--accent); }
  .auth-tab-btn:hover:not(.active){ color:var(--ink); }
  .auth-card{ max-width:380px; width:100%; margin-top:26px; text-align:left; color:var(--ink); }
  .auth-card h2{ font-size:19px; }
  .demo-otp{ font-family:'Instrument Serif',serif; font-style:italic; font-size:38px; color:var(--primary); text-align:center; margin:12px 0 2px; letter-spacing:6px; }
  .auth-linkrow{ display:flex; justify-content:space-between; margin-top:12px; }
  .auth-link{ font-family:inherit; background:none; border:none; padding:0; margin:0; font-size:12.5px; font-weight:700; cursor:pointer; }
  .auth-link.muted{ color:var(--ink-soft); }
  .auth-link.primary{ color:var(--primary-2); }
  .session-badge{ font-size:12px; color:#F4F6F3; opacity:0.85; align-self:center; }
  .headerRight{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  footer{ margin-top:40px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-soft); line-height:1.6; }
  .empty{ font-size:13.5px; color:var(--ink-soft); padding:14px 0; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<!-- ============ LANGUAGE / LANDING PAGE ============ -->
<div class="landing" id="landing">
  <div class="brandrow">
    <svg class="bridge-mark" viewBox="0 0 48 48" fill="none">
      <path d="M4 34C10 22 16 22 24 22C32 22 38 22 44 34" stroke="#E2932B" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M4 34H44" stroke="#F4F6F3" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="12" cy="34" r="2.4" fill="#F4F6F3"/>
      <circle cx="24" cy="34" r="2.4" fill="#F4F6F3"/>
      <circle cx="36" cy="34" r="2.4" fill="#F4F6F3"/>
    </svg>
    <h1>KrishiSetu</h1>
  </div>
  <div class="devname">कृषि सेतु</div>
  <p class="lead" id="landingLead">Book a procurement slot, skip the queue, and get paid on time. Choose the language you're comfortable with to continue.</p>
  <div class="lang-grid" id="langGrid"></div>
  <div class="continue-row">
    <button class="btn-continue" id="continueBtn" disabled>Continue</button>
    <p class="partial-note" id="partialNote"></p>
  </div>
</div>

<!-- ============ LOGIN / REGISTER (OTP) ============ -->
<div class="landing hidden" id="authScreen">
  <div class="brandrow">
    <svg class="bridge-mark" viewBox="0 0 48 48" fill="none">
      <path d="M4 34C10 22 16 22 24 22C32 22 38 22 44 34" stroke="#E2932B" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M4 34H44" stroke="#F4F6F3" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="12" cy="34" r="2.4" fill="#F4F6F3"/>
      <circle cx="24" cy="34" r="2.4" fill="#F4F6F3"/>
      <circle cx="36" cy="34" r="2.4" fill="#F4F6F3"/>
    </svg>
    <h1>KrishiSetu</h1>
  </div>
  <div class="devname">कृषि सेतु</div>
  <div class="card auth-card" id="authCard"></div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <svg class="bridge-mark" viewBox="0 0 48 48" fill="none">
          <path d="M4 34C10 22 16 22 24 22C32 22 38 22 44 34" stroke="#E2932B" stroke-width="4" stroke-linecap="round"/>
          <path d="M4 34H44" stroke="#F4F6F3" stroke-width="4" stroke-linecap="round"/>
          <circle cx="12" cy="34" r="2.6" fill="#F4F6F3"/>
          <circle cx="24" cy="34" r="2.6" fill="#F4F6F3"/>
          <circle cx="36" cy="34" r="2.6" fill="#F4F6F3"/>
        </svg>
        <div>
          <h1>KrishiSetu</h1>
          <p class="tagline" id="tagline"></p>
        </div>
      </div>
      <div class="headerRight">
        <span class="session-badge" id="sessionBadge"></span>
        <button class="langswitch" id="logoutBtn">↩ <span id="logoutLabel"></span></button>
        <button class="langswitch" id="langSwitchBtn">🌐 <span id="langSwitchLabel"></span></button>
      </div>
    </div>
    <div class="top-inner" style="padding-top:0;">
      <nav class="tabs" id="tabs">
        <button data-tab="book" class="active"></button>
        <button data-tab="track"></button>
        <button data-tab="board"></button>
        <button data-tab="admin"></button>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <section class="panel" id="panel"></section>
    <footer id="footerNote"></footer>
  </div>
</div>

function tr(lang, key){
  const set = T[FULL_LANGS.includes(lang) ? lang : 'en'];
  return (set && set[key] !== undefined) ? set[key] : (T.en[key] || key);
}
function cropName(lang, cropKey){
  const set = T[FULL_LANGS.includes(lang) ? lang : 'en'];
  return (set && set.crops && set.crops[cropKey]) || T.en.crops[cropKey];
}

/* ================= STATE ================= */
let STATE = { bookings: [], notifications: {}, counters: {}, users: {} };
let currentLang = 'en';
let currentTab = "book";
let adminUnlocked = false;
let currentUser = null;      // {phone, name, village}
let authStep = 'phone';      // 'phone' | 'otp' | 'register'
let authMode = 'login';      // 'login' | 'register'
let authPhone = '';
let authOtp = null;
let authIsNewUser = false;

function dateOptions(lang){
  const out = [];
  const labels = [tr(lang,'today'), tr(lang,'tomorrow'), tr(lang,'dayafter')];
  for(let i=0;i<3;i++){
    const d = new Date();
    d.setDate(d.getDate()+i);
    const iso = d.toISOString().slice(0,10);
    const disp = d.toLocaleDateString('en-IN',{day:'numeric', month:'short'});
    out.push({iso, label: labels[i]+" · "+disp});
  }
  return out;
}
function ckey(center,date){ return center+"|"+date; }
function getCounter(center,date){
  const k = ckey(center,date);
  if(!STATE.counters[k]) STATE.counters[k] = {nextToken:1, nowServing:0};
  return STATE.counters[k];
}
function bookingsFor(center,date){
  return STATE.bookings.filter(b=>b.center===center && b.date===date).sort((a,b)=>a.token-b.token);
}
function addNotif(phone,text){
  if(!STATE.notifications[phone]) STATE.notifications[phone]=[];
  STATE.notifications[phone].unshift({t:new Date().toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'}), text});
}
function dateLabel(iso){
  const found = dateOptions(currentLang).find(d=>d.iso===iso);
  return found ? found.label : iso;
}

async function loadState(){
  try{
    const res = await window.storage.get(STATE_KEY, true);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      STATE = Object.assign({bookings:[],notifications:{},counters:{},users:{}}, parsed);
      if(!STATE.users) STATE.users = {};
    }
  }catch(e){ /* no data yet */ }
}
async function saveState(){
  try{ await window.storage.set(STATE_KEY, JSON.stringify(STATE), true); }catch(e){ console.error("storage error", e); }
}
async function loadLangPref(){
  try{
    const res = await window.storage.get(LANG_KEY, false);
    if(res && res.value) return res.value;
  }catch(e){}
  return null;
}
async function saveLangPref(lang){
  try{ await window.storage.set(LANG_KEY, lang, false); }catch(e){}
}
async function loadSession(){
  try{
    const res = await window.storage.get(SESSION_KEY, false);
    if(res && res.value) return res.value;
  }catch(e){}
  return null;
}
async function saveSession(phone){
  try{ await window.storage.set(SESSION_KEY, phone, false); }catch(e){}
}
async function clearSession(){
  try{ await window.storage.delete(SESSION_KEY, false); }catch(e){}
}

/* ================= AUTH (LOGIN / REGISTER VIA OTP) ================= */
function showAuthScreen(mode){
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  authStep = 'phone'; authMode = mode === 'register' ? 'register' : 'login'; authPhone = ''; authOtp = null; authIsNewUser = false;
  renderAuth();
}
function authTabsHtml(L){
  return `
    <div class="auth-tabs">
      <button class="auth-tab-btn ${authMode==='login'?'active':''}" id="au_tabLogin">${tr(L,'authTabLogin')}</button>
      <button class="auth-tab-btn ${authMode==='register'?'active':''}" id="au_tabRegister">${tr(L,'authTabRegister')}</button>
    </div>`;
}
function wireAuthTabs(){
  document.getElementById('au_tabLogin').addEventListener('click', ()=>{
    if(authMode==='login') return;
    authMode='login'; authStep='phone'; authPhone=''; authOtp=null; authIsNewUser=false;
    renderAuth();
  });
  document.getElementById('au_tabRegister').addEventListener('click', ()=>{
    if(authMode==='register') return;
    authMode='register'; authStep='phone'; authPhone=''; authOtp=null; authIsNewUser=false;
    renderAuth();
  });
}
function renderAuth(){
  const L = currentLang;
  const card = document.getElementById('authCard');
  if(authStep === 'phone'){
    card.innerHTML = `
      ${authTabsHtml(L)}
      <h2>${authMode==='register' ? tr(L,'authTabRegister') : tr(L,'authTabLogin')}</h2>
      <p class="hint">${authMode==='register' ? tr(L,'registerLead') : tr(L,'loginLead')}</p>
      <label>${tr(L,'lblPhone')}</label>
      <input type="tel" id="au_phone" pattern="[0-9]{10}" maxlength="10" placeholder="${tr(L,'phonePh')}">
      <button class="btn" id="au_sendOtp" style="width:100%;">${tr(L,'btnSendOtp')}</button>
      <div id="au_msg"></div>`;
    wireAuthTabs();
    document.getElementById('au_sendOtp').addEventListener('click', ()=>{
      const phone = document.getElementById('au_phone').value.trim();
      const msg = document.getElementById('au_msg');
      if(!/^[0-9]{10}$/.test(phone)){ msg.innerHTML = `<div class="msg err">${tr(L,'errPhone')}</div>`; return; }
      const exists = !!STATE.users[phone];
      if(authMode==='login' && !exists){ msg.innerHTML = `<div class="msg err">${tr(L,'errNotRegistered')}</div>`; return; }
      if(authMode==='register' && exists){ msg.innerHTML = `<div class="msg err">${tr(L,'errAlreadyRegistered')}</div>`; return; }
      authPhone = phone;
      authIsNewUser = (authMode==='register');
      authOtp = String(Math.floor(100000 + Math.random()*900000));
      authStep = 'otp';
      renderAuth();
    });
  } else if(authStep === 'otp'){
    card.innerHTML = `
      <h2>${authMode==='register' ? tr(L,'authTabRegister') : tr(L,'authTabLogin')}</h2>
      <p class="hint">${authIsNewUser ? tr(L,'newUserMsg') : tr(L,'welcomeBack')}</p>
      <div class="demo-otp">${authOtp}</div>
      <p class="hint" style="text-align:center; margin-top:-6px;">${tr(L,'otpNote')}</p>
      <label>${tr(L,'lblOtp')}</label>
      <input type="text" id="au_otp" maxlength="6" inputmode="numeric" placeholder="••••••">
      <button class="btn" id="au_verifyOtp" style="width:100%;">${tr(L,'btnVerifyOtp')}</button>
      <div class="auth-linkrow">
        <button class="auth-link primary" id="au_resend">${tr(L,'btnResendOtp')}</button>
        <button class="auth-link muted" id="au_back">${tr(L,'btnChangeNumber')}</button>
      </div>
      <div id="au_msg"></div>`;
    document.getElementById('au_verifyOtp').addEventListener('click', async ()=>{
      const val = document.getElementById('au_otp').value.trim();
      const msg = document.getElementById('au_msg');
      if(val !== authOtp){ msg.innerHTML = `<div class="msg err">${tr(L,'errOtp')}</div>`; return; }
      if(authIsNewUser){
        authStep = 'register';
        renderAuth();
      } else {
        currentUser = STATE.users[authPhone];
        await saveSession(authPhone);
        enterApp();
      }
    });
    document.getElementById('au_resend').addEventListener('click', ()=>{
      authOtp = String(Math.floor(100000 + Math.random()*900000));
      renderAuth();
    });
    document.getElementById('au_back').addEventListener('click', ()=>{
      authStep = 'phone';
      renderAuth();
    });
  } else if(authStep === 'register'){
    card.innerHTML = `
      <h2>${tr(L,'regH')}</h2>
      <p class="hint">${tr(L,'regSub')}</p>
      <label>${tr(L,'lblName')}</label>
      <input type="text" id="au_name">
      <label>${tr(L,'lblVillage')}</label>
      <input type="text" id="au_village">
      <button class="btn" id="au_register" style="width:100%;">${tr(L,'btnRegister')}</button>
      <div id="au_msg"></div>`;
    document.getElementById('au_register').addEventListener('click', async ()=>{
      const name = document.getElementById('au_name').value.trim();
      const village = document.getElementById('au_village').value.trim();
      const msg = document.getElementById('au_msg');
      if(!name || !village){ msg.innerHTML = `<div class="msg err">${tr(L,'errRequired')}</div>`; return; }
      STATE.users[authPhone] = { phone: authPhone, name, village, createdAt: Date.now() };
      await saveState();
      currentUser = STATE.users[authPhone];
      await saveSession(authPhone);
      enterApp();
    });
  }
}

      <span class="eng">${l.eng}</span>

  grid.querySelectorAll('.lang-chip').forEach(chip=>{

function wireBook(){
  const L = currentLang;
  document.getElementById('bookForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = document.getElementById('f_name').value.trim();
    const phone = document.getElementById('f_phone').value.trim();
    const village = document.getElementById('f_village').value.trim();
    const cropKey = document.getElementById('f_crop').value;
    const qty = parseFloat(document.getElementById('f_qty').value);
    const center = document.getElementById('f_center').value;
    const date = document.getElementById('f_date').value;
    const slot = document.getElementById('f_slot').value;
    const area = document.getElementById('bookMsgArea');

    if(!/^[0-9]{10}$/.test(phone)){ area.innerHTML = `<div class="msg err">${tr(L,'errPhone')}</div>`; return; }
    const slotCount = STATE.bookings.filter(b=>b.center===center && b.date===date && b.slot===slot).length;
    if(slotCount >= SLOT_CAPACITY){
      area.innerHTML = `<div class="msg err">${slot} — ${center} — ${dateLabel(date)}</div>`;
      return;
    }
    const counter = getCounter(center,date);
    const token = counter.nextToken++;
    const booking = { id: center+date+token+"-"+Date.now(), token, name, phone, village, cropKey, qty, center, date, slot,
      status:'booked', procuredQty:null, paymentAmount:null, createdAt: Date.now() };
    STATE.bookings.push(booking);
    addNotif(phone, `${tr(L,'tokenLbl')} #${token} — ${center}, ${dateLabel(date)}, ${slot}`);
    await saveState();

    const position = token - counter.nowServing;
    const waitMin = Math.max(0, (position-1)) * AVG_MIN_PER_FARMER;
    area.innerHTML = `
      <div class="token-confirm">
        <div class="label">${tr(L,'tokenLbl').toUpperCase()}</div>
        <div class="num">#${token}</div>
        <div class="detail">${center} · ${dateLabel(date)} · ${slot}</div>
        <div class="detail">${tr(L,'waitLbl')}: ~${waitMin} min</div>
      </div>
      <div class="msg ok">${tr(L,'searchPrompt')}</div>`;
    document.getElementById('bookForm').reset();
  });
}

function wireTrack(){
  const L = currentLang;
  document.getElementById('t_search').addEventListener('click', ()=>{

      rBox.innerHTML = mine.map(b=>{
        const counter = getCounter(b.center,b.date);

        const waitMin = Math.max(0,(position-1))*AVG_MIN_PER_FARMER;
        let posLine = '';
        if(b.status==='booked') posLine = `<div class="statline"><span>${tr(L,'aheadLbl')}</span><b>${Math.max(0,position-1)}</b></div><div class="statline"><span>${tr(L,'waitLbl')}</span><b>~${waitMin} min</b></div>`;

        </div>`;
      }).join('');

    nBox.innerHTML = notifs.length ? notifs.map(n=>`<div class="notif"><div class="t">${n.t}</div>${n.text}</div>`).join('')

}
function refreshBoard(){
  const L = currentLang;
  const center = document.getElementById('b_center').value;
  const date = document.getElementById('b_date').value;
  const counter = getCounter(center,date);
  const all = bookingsFor(center,date);
  const waiting = all.filter(b=>b.status==='booked');
  const completed = all.filter(b=>b.status==='paid').length;

  document.getElementById('b_serving').textContent = counter.nowServing ? '#'+counter.nowServing : '—';
  document.getElementById('b_subline').textContent = `${center} · ${dateLabel(date)}`;

  const upcoming = waiting.slice(0,5);
  document.getElementById('b_upcoming').innerHTML = upcoming.length
    ? upcoming.map(b=>`<div class="statline"><span>#${b.token}</span><span>${b.slot}</span></div>`).join('')
    : `<div class="empty">${tr(L,'noWaiting')}</div>`;

  document.getElementById('b_stats').innerHTML = `
    <div class="statline"><span>${tr(L,'statTotal')}</span><b>${all.length}</b></div>
    <div class="statline"><span>${tr(L,'statWaiting')}</span><b>${waiting.length}</b></div>
    <div class="statline"><span>${tr(L,'statCompleted')}</span><b>${completed}</b></div>
    <div class="statline"><span>${tr(L,'statCapacity')}</span><b>${SLOT_CAPACITY}/hr</b></div>
    <p class="hint" style="margin-top:16px;">${tr(L,'congestionNote')}</p>`;
}
function wireBoard(){
  ['b_center','b_date'].forEach(id=>document.getElementById(id).addEventListener('change', refreshBoard));
  refreshBoard();
}

/* ================= ADMIN TAB ================= */
function renderAdmin(){
  const L = currentLang;
  if(!adminUnlocked){
    return `
    <div class="pin-gate">
      <div class="card">
        <h2>${tr(L,'adminH')}</h2>
        <p class="hint">${tr(L,'adminSub')}</p>
        <input type="text" id="pin" placeholder="${tr(L,'pinPh')}" maxlength="4">
        <button class="btn" id="pinBtn" style="width:100%;">${tr(L,'btnEnter')}</button>
        <p class="hint" style="margin-top:10px;">${tr(L,'pinNote')}</p>
        <div id="pinMsg"></div>
      </div>
    </div>`;
  }
  const centerOpts = CENTERS.map(c=>`<option value="${c}">${c}</option>`).join('');
  const dateOpts = dateOptions(L).map(d=>`<option value="${d.iso}">${d.label}</option>`).join('');
  return `
  <div class="queue-select">
    <div><label>${tr(L,'centerLbl')}</label><select id="a_center">${centerOpts}</select></div>
    <div><label>${tr(L,'lblDate')}</label><select id="a_date">${dateOpts}</select></div>
    <div><button class="btn gold" id="callNext">${tr(L,'btnCallNext')}</button></div>
  </div>
  <div class="card" style="overflow-x:auto;">
    <h2>${tr(L,'boardUpnext')}</h2>
    <table>
      <thead><tr><th>${tr(L,'thToken')}</th><th>${tr(L,'thFarmer')}</th><th>${tr(L,'thCropQty')}</th><th>${tr(L,'thStatus')}</th><th>${tr(L,'thAction')}</th></tr></thead>
      <tbody id="a_rows"></tbody>
    </table>
  </div>
  <div class="card">
    <h2>${tr(L,'adminH')}</h2>
    <div id="a_stats"></div>
  </div>`;
}
function refreshAdmin(){
  if(!adminUnlocked) return;
  const L = currentLang;
  const center = document.getElementById('a_center').value;
  const date = document.getElementById('a_date').value;
  const counter = getCounter(center,date);
  const rows = bookingsFor(center,date);
  const tbody = document.getElementById('a_rows');

  tbody.innerHTML = rows.length ? rows.map(b=>{
    let action = '';
    if(b.status==='booked'){
      action = `<span style="color:var(--ink-soft); font-size:12.5px;">${tr(L,'waitingCall')}</span>`;
    } else if(b.status==='progress'){
      action = `<div class="actioncell">
        <input type="number" id="qty_${b.id}" value="${b.qty}" step="0.5" min="0">
        <button class="btn small" onclick="markProcured('${b.id}')">${tr(L,'btnProcure')}</button>
      </div>`;
    } else if(b.status==='procured'){
      const suggested = Math.round(b.procuredQty * (RATES[b.cropKey]||2000));
      action = `<div class="actioncell">
        <input type="number" id="amt_${b.id}" value="${suggested}" step="1">
        <button class="btn small gold" onclick="markPaid('${b.id}')">${tr(L,'btnPay')}</button>
      </div>`;
    } else if(b.status==='paid'){
      action = `<span style="color:var(--moss); font-size:12.5px;">${tr(L,'complete')}</span>`;
    }
    return `<tr>
      <td><b>#${b.token}</b></td>
      <td>${b.name}<br><span style="color:var(--ink-soft); font-size:12px;">${b.phone} · ${b.village}</span></td>
      <td>${cropName(L,b.cropKey)}<br><span style="color:var(--ink-soft); font-size:12px;">${b.qty} qtl</span></td>
      <td>${statusPill(b.status)}</td>
      <td>${action}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="5" class="empty">${tr(L,'noRows')}</td></tr>`;

  const waiting = rows.filter(r=>r.status==='booked').length;
  const paidRows = rows.filter(r=>r.status==='paid');
  let avgCycle = '—';
  if(paidRows.length){
    const mins = paidRows.reduce((s,r)=> s + (r.paidAt - r.createdAt), 0) / paidRows.length / 60000;
    avgCycle = Math.round(mins) + ' min';
  }
  document.getElementById('a_stats').innerHTML = `
    <div class="statline"><span>${tr(L,'stNowServing')}</span><b>${counter.nowServing ? '#'+counter.nowServing : '—'}</b></div>
    <div class="statline"><span>${tr(L,'stStillWaiting')}</span><b>${waiting}</b></div>
    <div class="statline"><span>${tr(L,'stCompleted2')}</span><b>${paidRows.length}</b></div>
    <div class="statline"><span>${tr(L,'stAvgCycle')}</span><b>${avgCycle}</b></div>`;
}
window.callNextToken = async function(){
  const center = document.getElementById('a_center').value;
  const date = document.getElementById('a_date').value;
  const counter = getCounter(center,date);
  const rows = bookingsFor(center,date).filter(b=>b.status==='booked');
  if(rows.length===0){ return; }
  const next = rows[0];
  next.status = 'progress';
  counter.nowServing = next.token;
  addNotif(next.phone, `#${next.token} — ${center}`);
  await saveState();
  refreshAdmin();
};
window.markProcured = async function(id){
  const b = STATE.bookings.find(x=>x.id===id);
  const qty = parseFloat(document.getElementById('qty_'+id).value);
  if(!qty || qty<=0) return;
  b.procuredQty = qty;
  b.status = 'procured';
  addNotif(b.phone, `${cropName(currentLang,b.cropKey)} — ${qty} qtl — ${b.center}`);
  await saveState();
  refreshAdmin();
};
window.markPaid = async function(id){
  const b = STATE.bookings.find(x=>x.id===id);
  const amt = parseFloat(document.getElementById('amt_'+id).value);
  if(!amt || amt<=0) return;
  b.paymentAmount = amt;
  b.paidAt = Date.now();
  b.status = 'paid';
  addNotif(b.phone, `₹${amt.toLocaleString('en-IN')} — #${b.token}`);
  await saveState();
  refreshAdmin();
};
function wireAdmin(){
  const L = currentLang;
  if(!adminUnlocked){
    document.getElementById('pinBtn').addEventListener('click', ()=>{
      const val = document.getElementById('pin').value.trim();
      if(val==='1234'){ adminUnlocked = true; render(); }
      else document.getElementById('pinMsg').innerHTML = `<div class="msg err">${tr(L,'errPin')}</div>`;
    });
    return;
  }
  document.getElementById('callNext').addEventListener('click', window.callNextToken);
  ['a_center','a_date'].forEach(id=>document.getElementById(id).addEventListener('change', refreshAdmin));
  refreshAdmin();
}

/* ================= ROUTER ================= */
function render(){
  applyStaticText();
  const panel = document.getElementById('panel');
  if(currentTab==='book'){ panel.innerHTML = renderBook(); wireBook(); }
  else if(currentTab==='track'){ panel.innerHTML = renderTrack(); wireTrack(); }
  else if(currentTab==='board'){ panel.innerHTML = renderBoard(); wireBoard(); }
  else if(currentTab==='admin'){ panel.innerHTML = renderAdmin(); wireAdmin(); }
  document.querySelectorAll('nav.tabs button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.tab===currentTab);
  });
}
document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  render();
});

(async function init(){
  buildLangGrid();
  document.getElementById('landingLead').textContent = tr('en','langLead');
  await loadState();
  const savedLang = await loadLangPref();
  const savedPhone = await loadSession();
  if(savedLang){
    currentLang = savedLang;
    if(savedPhone && STATE.users[savedPhone]){
      currentUser = STATE.users[savedPhone];
      enterApp();
    } else {
      showAuthScreen();
    }
  }
  setInterval(async ()=>{
    await loadState();
    if(document.getElementById('app').classList.contains('hidden')) return;
    if(currentTab==='board') refreshBoard();
    if(currentTab==='admin') refreshAdmin();
  }, 4000);
})();
</script>
